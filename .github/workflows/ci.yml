name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - name: Build C kernel
        run: sh c/build.sh
      - name: Correctness suite
        run: python -m pytest python/test_correctness.py -q
      - name: Interface probe (C-ABI export round-trip)
        run: python python/interface_probe.py

  mojo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi + Mojo nightly
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          "$HOME/.pixi/bin/pixi" global install mojo \
            -c https://conda.modular.com/max-nightly -c conda-forge
          echo "$HOME/.pixi/envs/mojo/bin" >> "$GITHUB_PATH"
          echo "MODULAR_HOME=$HOME/.pixi/envs/mojo/share/max" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - name: Mojo substrate runs + cross-checksum gate
        run: python python/bench.py
      - name: Upload bench receipt
        uses: actions/upload-artifact@v4
        with:
          name: bench-json
          path: outputs/bench.json

  keyscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Key-scan negative control (fail on credential-shaped literals)
        run: |
          ! grep -rEn "apikey_[A-Za-z0-9]{8,}|ghp_[A-Za-z0-9]{8,}|sk-di-[A-Za-z0-9]{8,}|moth_[A-Za-z0-9]{8,}|gsk_[A-Za-z0-9]{8,}" \
            --include="*.py" --include="*.mojo" --include="*.md" --include="*.yml" --include="*.c" --include="*.h" .
