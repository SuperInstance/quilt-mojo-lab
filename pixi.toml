[project]
name = "quilt-mojo-lab"
description = "High-performance flat-memory quilt substrate: Mojo/SIMD vs Python/C baselines"
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = "*"
python = "3.12.*"
numpy = "*"
pytest = "*"

[tasks]
test = "python -m pytest python/test_correctness.py -q"
bench = "python python/bench.py"
mojo-demo = "mojo run mojo/quilt_high_perf.mojo"
